services:
  # BUQ, Fitco, Wodify, Atombox y Mgic tienen histórico real (las clases pasadas
  # no se resetean/desaparecen), así que basta una corrida diaria al final del día.
  # Se quedan agrupados en este mismo servicio (aunque ya no es "solo BUQ") para no
  # tener que renombrar el servicio en Render y perder sus variables de entorno.
  - type: cron
    name: fitness-scraper-buq
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 5 * * *" # 05:00 UTC = 23:00 Ciudad de México (CDMX es UTC-6 todo el año)
    startCommand: sh -c "python -m core.runner --platform buq && python -m core.runner --platform fitco && python -m core.runner --platform wodify && python -m core.runner --platform atombox && python -m core.runner --platform mgic"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BUQ_EMAIL
        sync: false
      - key: BUQ_PASSWORD
        sync: false
      - key: BUQ_API_CLIENT
        sync: false
      - key: BUQ_API_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production

  # Mariana Tek, Síclo y Ollynk solo muestran clases futuras — una vez que la clase empieza,
  # la ocupación real desaparece (Mariana Tek la resetea a 0, Síclo/Ollynk la quitan de la lista).
  # Por eso se corren cada 30 min: es la única forma de acercarse a la ocupación final real.
  - type: cron
    name: fitness-scraper-realtime
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "*/30 * * * *"
    startCommand: sh -c "python -m core.runner --platform marianatek && python -m core.runner --platform siclo && python -m core.runner --platform ollynk"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SICLO_EMAIL
        sync: false
      - key: SICLO_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
