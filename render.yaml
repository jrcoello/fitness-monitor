services:
  # BUQ tiene histórico real (reservation_count no cambia después de la clase),
  # así que basta una corrida diaria al final del día para capturar todo.
  - type: cron
    name: fitness-scraper-buq
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 5 * * *" # 05:00 UTC = 23:00 Ciudad de México (CDMX es UTC-6 todo el año)
    startCommand: python -m core.runner --platform buq
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BUQ_EMAIL
        sync: false
      - key: BUQ_PASSWORD
        sync: false
      - key: BUQ_API_CLIENT
        sync: false
      - key: BUQ_API_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production

  # Mariana Tek y Síclo solo muestran clases futuras — una vez que la clase empieza,
  # la ocupación real desaparece (Mariana Tek la resetea a 0, Síclo la quita de la lista).
  # Por eso se corren cada 30 min: es la única forma de acercarse a la ocupación final real.
  - type: cron
    name: fitness-scraper-realtime
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "*/30 * * * *"
    startCommand: sh -c "python -m core.runner --platform marianatek && python -m core.runner --platform siclo"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SICLO_EMAIL
        sync: false
      - key: SICLO_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
